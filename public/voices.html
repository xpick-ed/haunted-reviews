<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>角色試聽｜靈異好評</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0e1222;
        --card: #171c30;
        --line: rgba(255, 255, 255, 0.08);
        --text: #f3efe6;
        --muted: rgba(243, 239, 230, 0.55);
        --gold: #ffd58a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: radial-gradient(ellipse at top, #1b2140 0%, var(--bg) 60%);
        background-attachment: fixed;
        color: var(--text);
        font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      main {
        max-width: 880px;
        margin: 0 auto;
        padding: 28px 16px 60px;
      }
      h1 {
        font-family: 'Noto Serif TC', serif;
        font-weight: 900;
        letter-spacing: 6px;
        color: var(--gold);
        margin: 0 0 4px;
        font-size: 30px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 22px;
        font-size: 14px;
        line-height: 1.6;
      }
      h2 {
        font-size: 15px;
        letter-spacing: 3px;
        color: var(--muted);
        font-weight: 500;
        margin: 34px 0 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 12px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px;
        position: relative;
        overflow: hidden;
      }
      .card::before {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 4px;
        background: var(--c);
      }
      .head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
      }
      .avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 700;
        color: #1a1420;
        background: var(--c);
        flex-shrink: 0;
      }
      .name {
        font-weight: 700;
        font-size: 17px;
      }
      .tag {
        font-size: 11px;
        padding: 1px 7px;
        border-radius: 999px;
        border: 1px solid currentColor;
        color: #8ff4ff;
        margin-left: 6px;
        vertical-align: 2px;
      }
      .desc {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
        margin: 0 0 8px;
      }
      .spec {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11px;
        color: rgba(243, 239, 230, 0.4);
        margin-bottom: 10px;
        word-break: break-all;
      }
      button.line {
        display: flex;
        width: 100%;
        gap: 10px;
        align-items: center;
        text-align: left;
        font: inherit;
        color: var(--text);
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 10px;
        margin-top: 6px;
        cursor: pointer;
        font-size: 14px;
        line-height: 1.4;
      }
      button.line:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      button.line.playing {
        border-color: var(--c);
        background: rgba(255, 255, 255, 0.1);
      }
      .icon {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--c);
        color: #1a1420;
        display: grid;
        place-items: center;
        font-size: 11px;
        flex-shrink: 0;
      }
      .dur {
        margin-left: auto;
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .sfx {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .sfx button {
        font: inherit;
        font-size: 13px;
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 14px;
        cursor: pointer;
      }
      .sfx button:active,
      button.line:active {
        transform: scale(0.98);
      }
      .err {
        color: #ff8a8a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>角色試聽</h1>
      <p class="sub">
        《靈異好評》每個角色的聲音。語音用 edge-tts 預先生成，再加上各自的效果（鬼有回音、老人有顫音……）。<br />
        重新生成：<code>scripts/gen_voices.py</code>；音效：<code>scripts/fetch_sfx.py</code>。
      </p>
      <div id="cast" class="grid"></div>
      <h2>音效</h2>
      <div id="sfx" class="sfx"></div>
    </main>
    <script>
      const player = new Audio()
      let playingBtn = null
      player.addEventListener('ended', () => playingBtn && playingBtn.classList.remove('playing'))

      function play(src, btn) {
        if (playingBtn) playingBtn.classList.remove('playing')
        player.src = src
        player.currentTime = 0
        player.play()
        playingBtn = btn
        if (btn) btn.classList.add('playing')
      }

      function el(tag, attrs = {}, ...kids) {
        const e = document.createElement(tag)
        for (const [k, v] of Object.entries(attrs)) {
          if (k === 'style') e.style.cssText = v
          else if (k.startsWith('on')) e.addEventListener(k.slice(2), v)
          else e.setAttribute(k, v)
        }
        for (const k of kids) e.append(k)
        return e
      }

      async function main() {
        const [cast, lines, sfx] = await Promise.all(
          ['voice/cast.json', 'voice/manifest.json', 'sfx/manifest.json'].map((u) => fetch(u).then((r) => r.json())),
        )
        const box = document.getElementById('cast')
        for (const c of cast) {
          const mine = Object.entries(lines).filter(([, l]) => l.who === c.id)
          const v = c.voice
          const card = el(
            'div',
            { class: 'card', style: `--c:${c.color}` },
            el('div', { class: 'head' }, el('div', { class: 'avatar' }, c.name.slice(-1)), el('div', { class: 'name' }, c.name, c.ghost ? el('span', { class: 'tag' }, '鬼') : '')),
            el('p', { class: 'desc' }, c.desc),
            el('div', { class: 'spec' }, `${v.voice.replace('Neural', '')} · ${v.rate} · ${v.pitch} · ${v.fx.join(' + ')}`),
          )
          for (const [id, l] of mine) {
            const btn = el('button', { class: 'line', title: id }, el('span', { class: 'icon' }, '▶'), el('span', {}, l.text), el('span', { class: 'dur' }, `${l.dur.toFixed(1)}s`))
            btn.addEventListener('click', () => play('voice/' + l.file, btn))
            card.append(btn)
          }
          box.append(card)
        }
        const sbox = document.getElementById('sfx')
        for (const [name, e] of Object.entries(sfx)) {
          let i = 0
          sbox.append(
            el(
              'button',
              {
                onclick: () => {
                  play('sfx/' + e.files[i % e.files.length], null)
                  i++
                },
              },
              `${name}${e.files.length > 1 ? ` ×${e.files.length}` : ''}`,
            ),
          )
        }
      }
      main().catch((err) => {
        document.getElementById('cast').append(el('p', { class: 'err' }, '載入失敗：' + err.message))
      })
    </script>
  </body>
</html>
